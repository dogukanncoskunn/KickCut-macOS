name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be exercised without cutting a tag first.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - run: npm ci

      # Goes through scripts/build-release.mjs, which keeps the build machine's
      # paths out of the binary - see that file for why. It also typechecks
      # first, because tauri.conf.json runs `npm run build` before bundling, so
      # a release can never be cut from code that does not compile.
      - name: Build the app
        env:
          # Signs the updater artifact. Without these the build still produces
          # a .dmg, but no .sig - and an installed copy refuses an update it
          # cannot verify, which is the point of signing it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Find what was built
        id: built
        run: |
          bundle=src-tauri/target/release/bundle
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name "*.dmg" | head -1)
          if [ -z "$dmg" ]; then echo "No .dmg was produced."; exit 1; fi

          # The app is unsigned, so a downloader has no way to tell a genuine
          # copy from one that was altered on its way to them - especially when
          # it arrives forwarded through chat rather than from the release page.
          # Publishing the hash gives them something to check against.
          sha=$(shasum -a 256 "$dmg" | cut -d" " -f1)

          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dmg")" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$(basename "$dmg")  $sha"

      # latest.json is what an installed copy reads to learn a newer one exists.
      # It carries the signature rather than the bundle, so the check is a few
      # hundred bytes and only a real update costs a download.
      #
      # Written on every run rather than only on a tag, because a manifest that
      # is first attempted during a release is a manifest whose first failure
      # happens with a half-made release already published. On a manual run the
      # tag is the branch name and the contents are nonsense; what is being
      # checked there is that it is produced at all.
      - name: Write the updater manifest
        id: updater
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          bundle=src-tauri/target/release/bundle
          tarball=$(find "$bundle/macos" -maxdepth 1 -name "*.app.tar.gz" | head -1)
          if [ -z "$tarball" ]; then echo "No updater bundle was produced."; exit 1; fi
          if [ ! -f "$tarball.sig" ]; then echo "No .sig - is the signing key set?"; exit 1; fi

          url="https://github.com/$REPO/releases/download/$TAG/$(basename "$tarball")"
          jq -n \
            --arg version "${TAG#v}" \
            --arg tag "$TAG" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$tarball.sig")" \
            --arg url "$url" \
            '{version: $version, notes: ("See the release notes for " + $tag + "."),
              pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' > latest.json

          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          cat latest.json

      # Nobody working on this has a Mac, so a manual run is the only chance to
      # look at the thing rather than infer it from a green tick. The runner is
      # a real machine with a login session, and Screen Recording is already
      # granted to the shell, so the app can be launched and photographed.
      #
      # It is only the launch screen: driving the UI further would need
      # Accessibility permission, which is not granted here. That is still
      # enough to see the window open at the right size, the dark theme land,
      # and the Library screen reach Kick.
      - name: Photograph it running
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "No .app was produced."; exit 1; fi
          open "$app"
          # Long enough for the webview to paint and for the Library screen to
          # get an answer back from Kick.
          sleep 25
          screencapture -x launch.png
          echo "captured $(du -h launch.png | cut -f1)"

      - name: Keep the photograph
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: launch-screen
          path: launch.png
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ steps.built.outputs.dmg }}
          TARBALL: ${{ steps.updater.outputs.tarball }}
          NAME: ${{ steps.built.outputs.name }}
          SHA: ${{ steps.built.outputs.sha256 }}
        run: |
          # Created here rather than by hand, so a tag push is the whole
          # release procedure and there is no step left to forget.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$DMG" --clobber

          # The updater takes the .app.tar.gz rather than the .dmg: it replaces
          # the bundle in place instead of mounting a disk image. Both are
          # published, because they answer different questions - one is how you
          # install it, the other is how an installed copy updates itself.
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sig" latest.json --clobber

          # Appended to whatever notes were generated, rather than replacing
          # them, so the changelog survives. The prose lives in its own file so
          # it can be read and edited as prose rather than as shell quoting.
          body=$(gh release view "$TAG" --json body -q .body)
          if [ "${body#*Opening it the first time}" = "$body" ]; then
            {
              printf "%s\n" "$body"
              sed -e "s/@NAME@/$NAME/g" -e "s/@SHA@/$SHA/g" .github/release-notes.md
            } > notes.md
            gh release edit "$TAG" --notes-file notes.md
          fi

      # On a manual run there is no tag to attach to, so the build is kept as
      # an artifact instead of being thrown away.
      - name: Keep the build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.built.outputs.name }}
          path: ${{ steps.built.outputs.dmg }}
