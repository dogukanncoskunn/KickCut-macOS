name: Checks

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS because that is what this fork targets: the ffmpeg pins, the
    # Finder reveal and the bundle are all macOS-specific, and testing them
    # anywhere else proves nothing. Windows is verified upstream in KickCut,
    # whose repository is public and whose CI is therefore free.
    #
    # Pinned to macos-14 rather than macos-latest so the architecture cannot
    # change under us: this build is Apple Silicon only.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rust ships with the runner image, so there is no toolchain step to go
      # stale. Only the build outputs are worth caching.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        # The network tests are excluded: they hit kick.com and gyan.dev, and a
        # CI run must not fail because someone else's server had a bad minute.
        run: cargo test --lib

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
