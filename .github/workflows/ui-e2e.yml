name: UI end to end

# The release build, launched on a real Apple Silicon Mac and used the way a
# person would: install FFmpeg from Settings, list a channel's broadcasts, cut
# 30 seconds, wait for the MP4, reveal it in Finder.
#
# ffmpeg-e2e.yml proves the pieces; this proves the assembled app - the webview
# reaching Kick, IPC, the queue, the mux and the Finder reveal together. The
# driver is .github/e2e/drive.js, injected into this build only.
#
# Pass/fail is the MP4 itself, read back with ffprobe. The screenshots and the
# walkthrough video are there to be looked at.

on:
  workflow_dispatch:
    inputs:
      channels:
        description: Channels to try, in order, until one lists a broadcast
        default: "xqc,adinross,trainwreckstv"
  push:
    paths:
      - ".github/workflows/ui-e2e.yml"
      - ".github/e2e/**"

jobs:
  ui:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      OUT_DIR: /tmp/kickcut-e2e
      CHANNELS: ${{ inputs.channels || 'xqc,adinross,trainwreckstv' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - run: npm ci

      # A classic script in <head> runs before the module that mounts React, so
      # the driver's localStorage lands before the first render.
      - name: Inject the driver
        run: |
          mkdir -p public
          sed -e "s|__CHANNELS__|$CHANNELS|" -e "s|__OUT_DIR__|$OUT_DIR|" .github/e2e/drive.js > public/e2e-drive.js
          sed -i '' 's|</head>|  <script src="/e2e-drive.js"></script>\n  </head>|' index.html
          grep -n e2e-drive index.html

      # Release profile, as shipped. No updater artefacts: those need the
      # signing key, and updating is not what is under test.
      - name: Build the app
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Run it
        run: |
          mkdir -p "$OUT_DIR" shots
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)

          # Everything the app writes is found later as "newer than this".
          touch "$RUNNER_TEMP/marker"

          # DNS on the default interface, and every connection held by the app,
          # WebKit's networking process and FFmpeg. network-report.mjs joins them.
          iface=$(route -n get default | awk '/interface:/ { print $2 }')
          sudo tcpdump -n -l -i "$iface" udp port 53 > dns.txt 2> /dev/null &
          (
            while true; do
              pids=$(pgrep -f 'KickCut.app/Contents/MacOS|com.apple.WebKit.Networking|/bin/ffmpeg|/bin/ffprobe' | paste -sd, -)
              [ -n "$pids" ] && lsof -nP -i -a -p "$pids" -F pcn 2> /dev/null
            done
          ) > conns.txt &
          echo $! > "$RUNNER_TEMP/lsof.pid"
          sleep 2

          open "$app"

          n=0
          settled=0
          # 2 s a frame, 30 minutes at most.
          while [ $n -lt 900 ]; do
            n=$((n + 1))
            screencapture -x "shots/$(printf %04d $n).png"
            if ! pgrep -f "KickCut.app/Contents/MacOS" > /dev/null; then
              echo "The app is no longer running."; exit 1
            fi
            if ls "$OUT_DIR"/*.mp4 > /dev/null 2>&1 && ! pgrep -x ffmpeg > /dev/null; then
              settled=$((settled + 1))
              # The driver keeps going after the MP4: 20 s on the queue, then the
              # Downloads screen and the Finder reveal.
              [ $settled -ge 25 ] && break
            fi
            sleep 2
          done
          ls -la "$OUT_DIR"

          # Quit the way a person does, so anything written on quit is counted;
          # fall back to a signal if AppleEvents are not permitted here.
          perl -e 'alarm 20; exec @ARGV' osascript -e 'quit app "KickCut"' || pkill -TERM -f KickCut.app/Contents/MacOS || true
          sleep 5
          kill "$(cat "$RUNNER_TEMP/lsof.pid")" || true
          sudo pkill tcpdump || true

      - name: What it talked to
        if: always()
        run: |
          node .github/e2e/network-report.mjs dns.txt conns.txt | tee network.md
          { echo "## Hosts the app connected to"; cat network.md; } >> "$GITHUB_STEP_SUMMARY"

      # The claim under test: the app keeps FFmpeg, one small record per job and
      # its WebView settings, and nothing else - a finished download leaves no
      # segments behind.
      - name: What it left on disk
        if: always()
        run: |
          {
            echo "## Everything written by the app"
            echo '```'
            find "$HOME/Library" /private/var/folders -newer "$RUNNER_TEMP/marker" 2> /dev/null \
              | grep -i -E 'kickcut|unsatisfied0' | sort
            echo '```'
            echo "### Sizes"
            echo '```'
            find "$HOME/Library" /private/var/folders -maxdepth 4 -newer "$RUNNER_TEMP/marker" -type d 2> /dev/null \
              | grep -i -E '(kickcut|unsatisfied0)[^/]*$' | while read -r d; do du -sh "$d"; done
            echo '```'
            echo "### Job records"
            echo '```json'
            find "$HOME/Library/Application Support/com.unsatisfied0.kickcut" -name '*.json' -exec cat {} \; 2> /dev/null
            echo
            echo '```'
            echo "### Cookies"
            echo '```'
            find "$HOME/Library" -newer "$RUNNER_TEMP/marker" -name '*.binarycookies' 2> /dev/null | while read -r c; do
              echo "$c"; strings "$c" | grep -o -E '[a-z0-9.-]+\.[a-z]{2,}' | sort -u
            done
            echo '```'
            echo "### Other files changed under ~/Library during the run (runner noise included)"
            echo '```'
            find "$HOME/Library" -newer "$RUNNER_TEMP/marker" -type f 2> /dev/null | grep -v -i -E 'kickcut|unsatisfied0' | head -40
            echo '```'
          } | tee footprint.md >> "$GITHUB_STEP_SUMMARY"

          leftovers=$(find "$HOME/Library/Application Support/com.unsatisfied0.kickcut" \( -name '*.ts' -o -name '*.part' \) 2> /dev/null | wc -l)
          if [ "$leftovers" -ne 0 ]; then echo "A finished job left $leftovers segment file(s) behind."; exit 1; fi

      - name: Check the MP4
        run: |
          support="$HOME/Library/Application Support/com.unsatisfied0.kickcut"
          ffprobe=$(find "$support" -name ffprobe -type f -perm -u+x | head -1)
          if [ -z "$ffprobe" ]; then echo "No executable managed ffprobe under $support"; exit 1; fi
          echo "managed FFmpeg: $(dirname "$ffprobe")"

          mp4=$(ls "$OUT_DIR"/*.mp4 | head -1)
          if [ -z "$mp4" ]; then echo "No MP4 was written."; exit 1; fi
          "$ffprobe" -v error -show_entries format=duration:stream=codec_type,codec_name,avg_frame_rate -of default=nw=1 "$mp4" | tee probe.txt

          duration=$(grep '^duration=' probe.txt | cut -d= -f2)
          grep -q '^codec_type=video' probe.txt || { echo "No video stream."; exit 1; }
          grep -q '^codec_name=aac' probe.txt || { echo "No AAC audio stream."; exit 1; }
          # The start snaps to the keyframe at or after 00:00:00, so allow slack.
          awk -v d="$duration" 'BEGIN { exit !(d > 25 && d < 35) }' || { echo "Duration $duration is not ~30 s."; exit 1; }
          echo "OK: $(du -h "$mp4" | cut -f1), ${duration}s"

      - name: Stitch the screenshots into a video
        if: always()
        continue-on-error: true
        run: |
          ffmpeg=$(find "$HOME/Library/Application Support/com.unsatisfied0.kickcut" -name ffmpeg -type f | head -1)
          "$ffmpeg" -v error -framerate 2 -pattern_type glob -i 'shots/*.png' \
            -vf "scale=1440:-2" -c:v libx264 -pix_fmt yuv420p walkthrough.mp4

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e
          path: |
            shots/
            walkthrough.mp4
            probe.txt
            network.md
            footprint.md
            dns.txt
            conns.txt
